<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Desk</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #17221f;
            --muted: #68736d;
            --paper: #f5f1e8;
            --panel: #fffdf8;
            --line: #d7ddd2;
            --accent: #d85f3f;
            --accent-dark: #a63d2c;
            --shadow: 0 24px 70px rgba(39, 54, 45, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background:
                radial-gradient(circle at 10% 0%, rgba(216, 95, 63, 0.18), transparent 28rem),
                linear-gradient(135deg, #f5f1e8 0%, #e9eee4 100%);
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            width: min(960px, calc(100% - 32px));
            margin: 0 auto;
            padding: 8vh 0 12vh;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--accent-dark);
            font: 700 0.75rem/1.2 system-ui, sans-serif;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 650px;
            margin: 0;
            font-size: clamp(2.7rem, 7vw, 5.8rem);
            font-weight: 400;
            line-height: 0.95;
            letter-spacing: -0.03em;
        }

        .intro {
            max-width: 560px;
            margin: 24px 0 42px;
            color: var(--muted);
            font: 1.05rem/1.6 system-ui, sans-serif;
        }

        .desk {
            overflow: hidden;
            border: 1px solid rgba(215, 221, 210, 0.9);
            border-radius: 8px;
            background: rgba(255, 253, 248, 0.86);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .desk-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--line);
            font: 700 0.8rem/1.2 system-ui, sans-serif;
        }

        .status {
            color: var(--muted);
            font-weight: 500;
        }

        .status::before {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 8px;
            border-radius: 50%;
            background: #72a875;
            content: "";
        }

        form {
            padding: 22px;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 150px;
            resize: vertical;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 4px;
            outline: none;
            color: var(--ink);
            background: #fffefb;
            font: 1.05rem/1.55 system-ui, sans-serif;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(216, 95, 63, 0.14);
        }

        .form-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-top: 14px;
        }

        .hint {
            color: var(--muted);
            font: 0.85rem/1.4 system-ui, sans-serif;
        }

        button {
            border: 0;
            border-radius: 3px;
            padding: 13px 20px;
            cursor: pointer;
            color: white;
            background: var(--accent);
            font: 700 0.9rem system-ui, sans-serif;
        }

        button:hover {
            background: var(--accent-dark);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        .answer {
            display: none;
            margin: 0 22px 22px;
            padding: 22px;
            border-top: 3px solid var(--accent);
            background: #f0f4ec;
            font: 1rem/1.7 system-ui, sans-serif;
            white-space: pre-wrap;
        }

        .answer.visible {
            display: block;
        }

        .error {
            color: #a63d2c;
        }

        @media (max-width: 600px) {
            main {
                width: min(100% - 22px, 960px);
                padding-top: 10vh;
            }

            .desk-head,
            form {
                padding: 16px;
            }

            .answer {
                margin: 0 16px 16px;
            }

            .form-foot {
                align-items: stretch;
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main>
        <p class="eyebrow">Local model desk</p>
        <h1>Ask something worth thinking about.</h1>
        <p class="intro">A quiet interface for sending a prompt through your local LiteLLM gateway.</p>

        <section class="desk" aria-label="Prompt workspace">
            <div class="desk-head">
                <span>Prompt</span>
                <span class="status" id="status">Ready</span>
            </div>
            <form id="prompt-form">
                <textarea id="prompt" name="prompt"
                    placeholder="Ask a question, request an explanation, or describe a task..." required></textarea>
                <div class="form-foot">
                    <button id="submit" type="submit">Send</button>
                </div>
            </form>
            <div class="answer" id="answer" role="status"></div>
        </section>
    </main>

    <script>
        const form = document.querySelector("#prompt-form");
        const prompt = document.querySelector("#prompt");
        const submit = document.querySelector("#submit");
        const status = document.querySelector("#status");
        const answer = document.querySelector("#answer");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            submit.disabled = true;
            status.textContent = "Thinking...";
            answer.classList.remove("visible", "error");
            answer.textContent = "";

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt.value }),
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "The request failed.");
                answer.textContent = result.text;
                answer.classList.add("visible");
                status.textContent = "Response received";
            } catch (error) {
                answer.textContent = error.message;
                answer.classList.add("visible", "error");
                status.textContent = "Request failed";
            } finally {
                submit.disabled = false;
            }
        });
    </script>
</body>

</html>
